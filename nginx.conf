events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 50M;
    limit_req_zone $binary_remote_addr zone=tts_api:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=voice_uploads:10m rate=20r/m;

    upstream api {
        server api:8000;
    }

    server {
        listen 80;
        server_name speech.flashcutai.com;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Frontend static files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # Health check
        location = /health {
            proxy_pass http://api/health;
            proxy_set_header Host $host;
        }

        # GPU-heavy generation endpoints
        location /api/tts/ {
            limit_req zone=tts_api burst=4 nodelay;
            proxy_pass http://api/api/tts/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout cho long-running requests
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # User-managed voice uploads/preprocessing
        location /api/voices/ {
            limit_req zone=voice_uploads burst=6 nodelay;
            proxy_pass http://api/api/voices/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout cho long-running requests
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # API proxy
        location /api/ {
            proxy_pass http://api/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout cho long-running requests
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
