services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OUTPUT_DIR=${OUTPUT_DIR:-/data/tts_outputs}
    volumes:
      - tts_outputs:/data/tts_outputs
      - voices:/data/voices
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build: .
    restart: unless-stopped
    command: >
      celery -A server.celery_app worker
      --concurrency=1
      --loglevel=info
      --queues=celery
    env_file:
      - path: .env
        required: false
    environment:
      - REDIS_URL=redis://redis:6379/0
      - MODEL_PATH_CUSTOM=${MODEL_PATH_CUSTOM:-Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice}
      - MODEL_PATH_BASE=${MODEL_PATH_BASE:-Qwen/Qwen3-TTS-12Hz-0.6B-Base}
      - DEVICE=${DEVICE:-cuda:0}
      - DTYPE=${DTYPE:-bfloat16}
      - OUTPUT_DIR=${OUTPUT_DIR:-/data/tts_outputs}
    volumes:
      - tts_outputs:/data/tts_outputs
      - voices:/data/voices
      - ${USERPROFILE:-/root}/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro    depends_on:
      - api

volumes:
  tts_outputs:
  voices:
